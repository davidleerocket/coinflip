<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Coin Bet</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    min-height: 100%;
    background: #111;
}
body {
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top))
             max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom))
             max(20px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
}
.game {
    text-align: center;
    width: 100%;
    max-width: 350px;
}
h1 { margin: 0 0 16px; font-size: 28px; }
#money {
    font-size: 42px;
    font-weight: bold;
    margin: 20px 0 12px;
}
.balance-panel {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    background: #181818;
    border: 1px solid #333;
    border-radius: 10px;
    text-align: left;
}
.panel-label {
    color: #888;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
}
#balanceChart {
    display: block;
    width: 100%;
    height: 120px;
}
.flip-history {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 30px;
    overflow: hidden;
}
.flip-chip {
    flex: 1 1 0;
    min-width: 0;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    color: white;
}
.flip-chip.heads { background: #178c4b; }
.flip-chip.tails { background: #b83a3a; }
.history-empty {
    color: #666;
    font-size: 13px;
}
.choice {
    display: flex;
    gap: 10px;
    width: 100%;
    margin: 0 0 10px;
}
button {
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    min-height: 52px;
    border: 3px solid #777;
    background: #222;
    color: white;
    cursor: pointer;
    border-radius: 8px;
    touch-action: manipulation;
    transition: transform 80ms ease, border-color 120ms ease, background 120ms ease;
}
.choice button {
    flex: 1;
    min-height: 54px;
}
.choice button:active { transform: scale(0.98); }
button.selected {
    background: #2a2a2a;
    border-color: #aaa;
}

.bet-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    width: 100%;
    align-items: stretch;
}
.bet-control {
    min-width: 0;
    min-height: 132px;
    border: 3px solid #777;
    background: #151515;
    color: white;
    border-radius: 8px;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    display: grid;
    grid-template-rows: 1fr 48px;
    transition: transform 80ms ease, border-color 120ms ease, background 120ms ease;
}
.bet-control.active { border-color: #8c8c8c; }
.bet-control.disabled {
    opacity: 0.45;
    cursor: default;
}
.bet-action {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    min-height: 0;
    padding: 12px 6px;
    border: 0;
    border-radius: 0;
    background: #1f1f1f;
    color: white;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: 0.01em;
    cursor: pointer;
}
.bet-action:active { transform: none; background: #2a2a2a; }
.bet-input-wrap {
    width: 100%;
    min-width: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 5px 5px;
    border-top: 3px solid #777;
    background: #3c3c3c;
    cursor: text;
    font-size: 17px;
    font-weight: bold;
    line-height: 1;
}
.bet-control.active .bet-input-wrap { border-top-color: #8c8c8c; }
.bet-value {
    display: inline-flex;
    align-items: center;
    border-bottom: 2px solid #aaa;
}
.bet-input-wrap:focus-within .bet-value { border-bottom-color: white; }
.bet-dollar {
    color: white;
    pointer-events: none;
}
.bet-input {
    width: 40px;
    min-width: 0;
    margin: 0;
    padding: 0;
    height: 27px;
    border: 0;
    border-bottom: 0;
    border-radius: 0;
    outline: none;
    background: transparent;
    color: white;
    font: inherit;
    font-size: 17px;
    font-weight: bold;
    text-align: left;
    -moz-appearance: textfield;
}
.bet-input::-webkit-outer-spin-button,
.bet-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
.all-in-control {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 132px;
    padding: 10px;
    border-color: #5849ff;
    background: #262047;
    cursor: pointer;
}
.all-in-control.active,
.all-in-control:hover { border-color: #6b5cff; }
.all-in-control:active { transform: scale(0.98); }
.all-in-label {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.18;
}

.milestone-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin: 6px 0 18px;
}

.milestone-bound {
    color: #3e3e3e;
    font-size: clamp(28px, 7vw, 38px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.04em;
    white-space: nowrap;
    user-select: none;
}

.milestone-bound.left { text-align: right; }
.milestone-bound.right { text-align: left; }

#money {
    margin: 0;
    min-width: 132px;
}

.milestone-pop-layer {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10010;
}

.milestone-pop {
    position: relative;
    padding: 20px 24px 18px;
    border: 2px solid rgba(255,255,255,0.92);
    border-radius: 16px;
    background: rgba(18,18,18,0.94);
    box-shadow: 0 18px 70px rgba(0,0,0,0.62), 0 0 36px rgba(66,232,135,0.18);
    text-align: center;
    opacity: 0;
    transform: scale(0.68);
    animation: milestone-hit 980ms cubic-bezier(.16,.9,.22,1) forwards;
    will-change: transform, opacity;
}

.milestone-kicker {
    color: #9dffbf;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.16em;
    margin-bottom: 4px;
}

.milestone-amount {
    color: white;
    font-size: clamp(46px, 14vw, 72px);
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.98;
    text-shadow: 0 0 22px rgba(66,232,135,0.32);
}

.milestone-pop::before,
.milestone-pop::after {
    content: "";
    position: absolute;
    inset: 50% auto auto 50%;
    width: 90px;
    height: 90px;
    border: 3px solid #42e887;
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.2);
    animation: milestone-ring 700ms ease-out forwards;
    z-index: -1;
}

.milestone-pop::after {
    animation-delay: 90ms;
}

@keyframes milestone-hit {
    0%   { opacity: 0; transform: scale(0.68); }
    18%  { opacity: 1; transform: scale(1.14); }
    34%  { opacity: 1; transform: scale(0.98); }
    62%  { opacity: 1; transform: scale(1.02); }
    100% { opacity: 0; transform: scale(1.08); }
}

@keyframes milestone-ring {
    0%   { opacity: 0.85; transform: translate(-50%, -50%) scale(0.2); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(3.4); }
}


.bust-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.58);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 10020;
    transition: opacity 120ms ease, visibility 120ms ease;
}

.bust-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.bust-card {
    width: min(310px, 100%);
    padding: 24px 20px 20px;
    border: 1px solid #555;
    border-radius: 14px;
    background: #181818;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.65);
    text-align: center;
    transform: scale(0.86);
}

.bust-overlay.show .bust-card {
    animation: bust-in 230ms cubic-bezier(.16,.9,.25,1.15) both;
}

.bust-title {
    color: #ff5d5d;
    font-size: clamp(42px, 13vw, 58px);
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: -0.04em;
    text-shadow: 0 0 18px rgba(255, 93, 93, 0.28);
}

.bust-hint {
    margin: 10px 0 16px;
    color: #aaa;
    font-size: 13px;
    line-height: 1.35;
}

#restartButton {
    width: 100%;
    min-height: 58px;
    background: white;
    color: black;
    border-color: white;
    font-size: 20px;
}

#restartButton:active {
    transform: scale(0.97);
}

@keyframes bust-in {
    0%   { opacity: 0; transform: scale(0.86); }
    72%  { opacity: 1; transform: scale(1.035); }
    100% { opacity: 1; transform: scale(1); }
}

.bet-pop-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
}
.bet-pop {
    --x: 0px;
    --y: 36%;
    position: absolute;
    left: calc(50% + var(--x));
    top: var(--y);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    font-weight: 900;
    letter-spacing: -0.03em;
    white-space: nowrap;
    text-align: center;
    opacity: 0;
    transform: translate(-50%, 4px) scale(0.72);
    animation: bet-pop 720ms cubic-bezier(.16,.88,.28,1) forwards;
    will-change: transform, opacity;
}
.bet-pop-result {
    font-size: clamp(18px, 5.2vw, 25px);
    line-height: 1;
    letter-spacing: 0.04em;
}
.bet-pop-amount {
    font-size: clamp(34px, 10vw, 50px);
    line-height: 1.02;
}
.bet-pop.win {
    color: #42e887;
    text-shadow: 0 0 10px rgba(66, 232, 135, 0.35), 0 3px 18px rgba(0, 0, 0, 0.65);
}
.bet-pop.loss {
    color: #ff5d5d;
    text-shadow: 0 0 10px rgba(255, 93, 93, 0.30), 0 3px 18px rgba(0, 0, 0, 0.65);
}
.bet-pop::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 74px;
    height: 74px;
    border: 2px solid currentColor;
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.2);
    animation: bet-ring 470ms cubic-bezier(.16,.8,.3,1) forwards;
    z-index: -1;
}
@keyframes bet-pop {
    0%   { opacity: 0; transform: translate(-50%, 5px) scale(0.72); }
    16%  { opacity: 1; transform: translate(-50%, -7px) scale(1.12); }
    34%  { opacity: 1; transform: translate(-50%, -13px) scale(1); }
    70%  { opacity: 1; transform: translate(-50%, -34px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -62px) scale(0.94); }
}
@keyframes bet-ring {
    0%   { opacity: 0.7; transform: translate(-50%, -50%) scale(0.2); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.7); }
}

@media (hover: hover) and (pointer: fine) {
    .bet-control:hover { border-color: #aaa; }
    .bet-control.active:hover { border-color: white; }
}
@media (max-width: 360px) {
    .bet-row { gap: 6px; }
    .bet-action { font-size: 14px; padding-left: 4px; padding-right: 4px; }
    .bet-input, .bet-input-wrap { font-size: 16px; }
    .bet-input { width: 38px; }
    .all-in-label { font-size: 15px; }
}
@media (max-height: 740px) {
    body { padding-top: 12px; padding-bottom: 12px; }
    #balanceChart { height: 95px; }
    .balance-panel { margin-bottom: 10px; }
    .bet-control, .all-in-control { min-height: 116px; }
    .bet-control { grid-template-rows: 1fr 44px; }
}
@media (max-width: 430px) {
    .milestone-row {
        width: 100%;
        gap: 9px;
    }
    .milestone-bound {
        font-size: clamp(24px, 8vw, 32px);
    }
    #money {
        min-width: 112px;
        font-size: clamp(34px, 11vw, 42px);
    }
}

@media (prefers-reduced-motion: reduce) {
    .bet-pop { animation-duration: 300ms; }
    .bet-pop::before { display: none; }
    .milestone-pop { animation-duration: 360ms; }
    .milestone-pop::before, .milestone-pop::after { display: none; }
}
</style>
</head>
<body>
<div class="game">
    <h1>Coin Bet</h1>
    <div class="milestone-row" aria-label="Balance milestone progress">
        <div id="milestoneLow" class="milestone-bound left">$0</div>
        <div id="money">$1.00</div>
        <div id="milestoneHigh" class="milestone-bound right">$10</div>
    </div>

    <div class="balance-panel">
        <div class="panel-label">BALANCE HISTORY</div>
        <canvas id="balanceChart" aria-label="Balance history chart"></canvas>
    </div>

    <div class="balance-panel">
        <div class="panel-label">LAST 10 FLIPS</div>
        <div id="flipHistory" class="flip-history">
            <span class="history-empty">No flips yet</span>
        </div>
    </div>

    <div class="choice">
        <button id="heads" class="selected" type="button" onclick="selectSide('heads', true)">HEADS</button>
        <button id="tails" type="button" onclick="selectSide('tails', true)">TAILS</button>
    </div>

    <div class="bet-row" aria-label="Bet controls">
        <div id="smallBetControl" class="bet-control active" data-bet="small">
            <button class="bet-action" type="button" data-place-bet="small" aria-label="Place small bet">SMALL<br>BET</button>
            <label class="bet-input-wrap" for="smallBet">
                <span class="bet-value">
                    <span class="bet-dollar">$</span>
                    <input id="smallBet" class="bet-input" type="number" min="0.01" step="0.01" inputmode="decimal" value="0.10" aria-label="Small bet amount">
                </span>
            </label>
        </div>

        <div id="largeBetControl" class="bet-control" data-bet="large">
            <button class="bet-action" type="button" data-place-bet="large" aria-label="Place large bet">LARGE<br>BET</button>
            <label class="bet-input-wrap" for="largeBet">
                <span class="bet-value">
                    <span class="bet-dollar">$</span>
                    <input id="largeBet" class="bet-input" type="number" min="0.01" step="0.01" inputmode="decimal" value="0.25" aria-label="Large bet amount">
                </span>
            </label>
        </div>

        <button id="allInControl" class="bet-control all-in-control" type="button" data-bet="allin" data-place-bet="allin" aria-label="Bet all available money">
            <span class="all-in-label">ALL<br>IN</span>
        </button>
    </div>
</div>

<div id="bustOverlay" class="bust-overlay" aria-hidden="true">
    <div class="bust-card" role="dialog" aria-modal="true" aria-labelledby="bustTitle">
        <div id="bustTitle" class="bust-title">BROKE</div>
        <div class="bust-hint">Tap restart • Desktop: SPACE / ENTER</div>
        <button id="restartButton" type="button">RESTART</button>
    </div>
</div>

<div id="betPopLayer" class="bet-pop-layer" aria-hidden="true"></div>
<div id="milestonePopLayer" class="milestone-pop-layer" aria-hidden="true"></div>

<script>
let money = 1.00;
let selectedSide = "heads";
let flipHistory = [];
let balanceHistory = [money];
let activeBet = "small";
let lastMilestoneBracket = 0;

/*
CUSTOM SOUND EFFECTS
Put these six files in a /sounds folder next to index.html in your GitHub repo.
Relative paths are intentional so this works on both custom domains and
GitHub project pages such as username.github.io/repository-name/.
*/
const SOUND_PATHS = {
    win: "./sounds/bet-win.mp3",
    loss: "./sounds/bet-loss.mp3",
    milestone: "./sounds/milestone.mp3",
    broke: "./sounds/broke.mp3",
    switch: "./sounds/switch.mp3",
    restart: "./sounds/restart.mp3"
};

// Easy per-effect volume tuning. Values range from 0.0 to 1.0.
const SOUND_VOLUME = {
    win: 1.00,
    loss: 1.00,
    milestone: 1.00,
    broke: 1.00,
    switch: 1.00,
    restart: 1.00
};

// Small pools let fast repeated bets retrigger/overlap sounds instead of
// waiting for the previous copy to finish.
const SOUND_POOL_SIZE = 4;
const soundPools = {};
const soundPoolIndex = {};

Object.entries(SOUND_PATHS).forEach(([name, path]) => {
    soundPools[name] = Array.from({ length: SOUND_POOL_SIZE }, () => {
        const audio = new Audio(path);
        audio.preload = "auto";
        audio.playsInline = true;
        return audio;
    });
    soundPoolIndex[name] = 0;
});

function playSound(name) {
    const pool = soundPools[name];
    if (!pool) return;

    const index = soundPoolIndex[name];
    const audio = pool[index];
    soundPoolIndex[name] = (index + 1) % pool.length;

    audio.volume = SOUND_VOLUME[name] ?? 1;
    audio.currentTime = 0;

    const playback = audio.play();
    if (playback && typeof playback.catch === "function") {
        // Missing files or browser autoplay restrictions should never stop gameplay.
        playback.catch(() => {});
    }
}

const moneyDisplay = document.getElementById("money");
const flipHistoryDisplay = document.getElementById("flipHistory");
const balanceChart = document.getElementById("balanceChart");
const smallBetInput = document.getElementById("smallBet");
const largeBetInput = document.getElementById("largeBet");
const betPopLayer = document.getElementById("betPopLayer");
const milestonePopLayer = document.getElementById("milestonePopLayer");
const milestoneLow = document.getElementById("milestoneLow");
const milestoneHigh = document.getElementById("milestoneHigh");
const bustOverlay = document.getElementById("bustOverlay");
const restartButton = document.getElementById("restartButton");
const betControls = {
    small: document.getElementById("smallBetControl"),
    large: document.getElementById("largeBetControl"),
    allin: document.getElementById("allInControl")
};

function formatMilestone(value) {
    return "$" + value.toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function getMilestoneBracket(value) {
    if (value < 10) return 0;
    return Math.floor(Math.log10(value));
}

function getMilestoneBounds(value) {
    if (value < 10) return { low: 0, high: 10, bracket: 0 };
    const bracket = getMilestoneBracket(value);
    const low = 10 ** bracket;
    const high = low * 10;
    return { low, high, bracket };
}

function updateMilestones(value = money) {
    const { low, high } = getMilestoneBounds(value);
    milestoneLow.textContent = formatMilestone(low);
    milestoneHigh.textContent = formatMilestone(high);
}

function showMilestonePopup(amount) {
    playSound("milestone");

    const popup = document.createElement("div");
    popup.className = "milestone-pop";
    popup.innerHTML = `<div class="milestone-kicker">MILESTONE</div><div class="milestone-amount">${formatMilestone(amount)}</div>`;
    milestonePopLayer.appendChild(popup);
    popup.addEventListener("animationend", event => {
        if (event.animationName === "milestone-hit") popup.remove();
    });
}

function checkMilestoneProgress(previousMoney, newMoney) {
    updateMilestones(newMoney);

    if (newMoney <= previousMoney) {
        lastMilestoneBracket = getMilestoneBracket(newMoney);
        return;
    }

    const previousBracket = getMilestoneBracket(previousMoney);
    const newBracket = getMilestoneBracket(newMoney);

    if (newBracket > previousBracket) {
        const achieved = 10 ** newBracket;
        showMilestonePopup(achieved);
    }

    lastMilestoneBracket = newBracket;
}

function selectSide(side, withSound = false) {
    const changed = side !== selectedSide;
    selectedSide = side;
    document.getElementById("heads").classList.remove("selected");
    document.getElementById("tails").classList.remove("selected");
    document.getElementById(side).classList.add("selected");

    if (withSound && changed) {
        playSound("switch");
    }
}

function toggleSide() {
    selectSide(selectedSide === "heads" ? "tails" : "heads", true);
}

function setActiveBet(type) {
    activeBet = type;
    Object.entries(betControls).forEach(([name, control]) => {
        control.classList.toggle("active", name === type);
    });
}

function updateFlipHistory() {
    if (flipHistory.length === 0) {
        flipHistoryDisplay.innerHTML = '<span class="history-empty">No flips yet</span>';
        return;
    }

    flipHistoryDisplay.innerHTML = flipHistory.slice(-10).map(outcome => {
        const letter = outcome === "heads" ? "H" : "T";
        return `<span class="flip-chip ${outcome}">${letter}</span>`;
    }).join("");
}

function drawBalanceChart() {
    const rect = balanceChart.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;

    const dpr = window.devicePixelRatio || 1;
    balanceChart.width = Math.round(rect.width * dpr);
    balanceChart.height = Math.round(rect.height * dpr);

    const ctx = balanceChart.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const width = rect.width;
    const height = rect.height;
    const pad = { top: 8, right: 6, bottom: 8, left: 6 };
    const values = balanceHistory;
    let minValue = Math.min(...values);
    let maxValue = Math.max(...values);

    if (minValue === maxValue) {
        const cushion = Math.max(0.05, Math.abs(minValue) * 0.1);
        minValue -= cushion;
        maxValue += cushion;
    } else {
        const cushion = (maxValue - minValue) * 0.12;
        minValue -= cushion;
        maxValue += cushion;
    }

    const x = i => pad.left + (values.length === 1 ? 0 : i / (values.length - 1)) * (width - pad.left - pad.right);
    const y = value => pad.top + (maxValue - value) / (maxValue - minValue) * (height - pad.top - pad.bottom);

    ctx.clearRect(0, 0, width, height);

    ctx.strokeStyle = "#2b2b2b";
    ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
        const gy = pad.top + (height - pad.top - pad.bottom) * i / 4;
        ctx.beginPath();
        ctx.moveTo(pad.left, gy);
        ctx.lineTo(width - pad.right, gy);
        ctx.stroke();
    }

    const positive = values[values.length - 1] >= values[0];
    const lineColor = positive ? "#33c875" : "#e05252";

    const gradient = ctx.createLinearGradient(0, pad.top, 0, height - pad.bottom);
    gradient.addColorStop(0, positive ? "rgba(51, 200, 117, 0.28)" : "rgba(224, 82, 82, 0.28)");
    gradient.addColorStop(1, positive ? "rgba(51, 200, 117, 0.01)" : "rgba(224, 82, 82, 0.01)");

    ctx.beginPath();
    values.forEach((value, i) => {
        const px = x(i);
        const py = y(value);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    });
    if (values.length === 1) ctx.lineTo(width - pad.right, y(values[0]));
    ctx.lineTo(width - pad.right, height - pad.bottom);
    ctx.lineTo(pad.left, height - pad.bottom);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();
    values.forEach((value, i) => {
        const px = x(i);
        const py = y(value);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    });
    if (values.length === 1) ctx.lineTo(width - pad.right, y(values[0]));
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();

    const lastX = values.length === 1 ? width - pad.right : x(values.length - 1);
    const lastY = y(values[values.length - 1]);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = lineColor;
    ctx.fill();
}

function getBetAmount(type) {
    if (type === "allin") return money;

    const input = type === "small" ? smallBetInput : largeBetInput;
    return parseFloat(input.value);
}

function showBetPopup(outcome, isWin, amount) {
    const popup = document.createElement("div");
    popup.className = "bet-pop " + (isWin ? "win" : "loss");
    popup.innerHTML = `<span class="bet-pop-result">${outcome.toUpperCase()}</span><span class="bet-pop-amount">${isWin ? "+$" : "-$"}${amount.toFixed(2)}</span>`;

    const chartRect = balanceChart.getBoundingClientRect();
    const verticalJitter = (Math.random() * 0.18 - 0.09) * chartRect.height;
    const popupY = chartRect.top + chartRect.height * 0.56 + verticalJitter;

    popup.style.setProperty("--x", (Math.random() * 64 - 32).toFixed(1) + "px");
    popup.style.setProperty("--y", popupY.toFixed(1) + "px");

    betPopLayer.appendChild(popup);
    popup.addEventListener("animationend", event => {
        if (event.animationName === "bet-pop") popup.remove();
    });
}

function setBrokeState() {
    const broke = money <= 0;
    Object.values(betControls).forEach(control => control.classList.toggle("disabled", broke));
    bustOverlay.classList.toggle("show", broke);
    bustOverlay.setAttribute("aria-hidden", broke ? "false" : "true");
}

function flipCoin(bet) {
    if (isNaN(bet) || bet <= 0) {
        return false;
    }

    bet = Math.round(bet * 100) / 100;

    if (bet > money) {
        return false;
    }

    const previousMoney = money;

    const outcome = Math.random() < 0.5 ? "heads" : "tails";
    flipHistory.push(outcome);
    updateFlipHistory();

    const isWin = outcome === selectedSide;
    if (isWin) {
        money += bet;
    } else {
        money -= bet;
    }

    playSound(isWin ? "win" : "loss");
    showBetPopup(outcome, isWin, bet);

    money = Math.round(money * 100) / 100;
    moneyDisplay.textContent = "$" + money.toFixed(2);
    checkMilestoneProgress(previousMoney, money);
    balanceHistory.push(money);
    drawBalanceChart();

    if (money <= 0) {
        playSound("broke");
    }
    setBrokeState();
    return true;
}

function restartGame() {
    playSound("restart");

    money = 1.00;
    selectedSide = "heads";
    flipHistory = [];
    balanceHistory = [money];
    activeBet = "small";
    lastMilestoneBracket = 0;

    moneyDisplay.textContent = "$1.00";

    updateFlipHistory();
    selectSide("heads");
    setActiveBet("small");
    setBrokeState();
    updateMilestones();
    drawBalanceChart();

    betPopLayer.replaceChildren();
    milestonePopLayer.replaceChildren();
}

restartButton.addEventListener("click", restartGame);

function placeBet(type) {
    if (money <= 0) {
        return;
    }

    setActiveBet(type);
    flipCoin(getBetAmount(type));
}

function repeatActiveBet() {
    if (document.activeElement === smallBetInput || document.activeElement === largeBetInput) {
        document.activeElement.blur();
    }
    placeBet(activeBet);
}

document.querySelectorAll("[data-place-bet]").forEach(button => {
    button.addEventListener("click", event => {
        event.stopPropagation();
        placeBet(button.dataset.placeBet);
    });
});

document.querySelectorAll(".bet-input-wrap").forEach(wrap => {
    wrap.addEventListener("click", () => {
        const input = wrap.querySelector(".bet-input");
        if (input) {
            input.focus();
            input.select();
        }
    });
});

[smallBetInput, largeBetInput].forEach(input => {
    input.addEventListener("focus", () => {
        setActiveBet(input === smallBetInput ? "small" : "large");
        input.select();
    });
    input.addEventListener("blur", () => {
        const value = parseFloat(input.value);
        if (isNaN(value) || value <= 0) {
            input.value = input === smallBetInput ? "0.10" : "0.25";
        } else {
            input.value = (Math.round(value * 100) / 100).toFixed(2);
        }
    });
});

document.addEventListener("keydown", event => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;

    if (event.key === "Tab") {
        event.preventDefault();
        if (document.activeElement === smallBetInput || document.activeElement === largeBetInput) {
            document.activeElement.blur();
        }
        toggleSide();
        return;
    }

    if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        if (money <= 0) {
            restartGame();
        } else {
            repeatActiveBet();
        }
    }
});

window.addEventListener("resize", drawBalanceChart);
drawBalanceChart();
updateMilestones();
setBrokeState();
</script>
</body>
</html>
